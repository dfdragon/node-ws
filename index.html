<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古韵流芳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            /* 宣纸白 */
            --text-primary: #2c2c2c;
            /* 墨色 */
            --text-secondary: #666;
            --accent-color: #a83f39;
            /* 印泥红 */
            --font-serif: 'Noto Serif SC', 'Songti SC', serif;
            --spacing-unit: 1rem;
            --transition-speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-serif);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 80vh;
            justify-content: space-between;
        }

        .site-header {
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            border: 1px solid var(--text-primary);
            padding: 0.3em 0.6em;
            border-radius: 2px;
        }

        .poetry-card {
            width: 100%;
            text-align: center;
            position: relative;
            padding: 2rem 0;
        }

        .poetry-content {
            opacity: 1;
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }

        .poetry-content.fade-out {
            opacity: 0;
            transform: translateY(10px);
        }

        .poetry-content.fade-in {
            opacity: 0;
            transform: translateY(-10px);
        }

        .poetry-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        .poetry-meta {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .dynasty {
            margin-right: 0.5em;
        }

        .dynasty::after {
            content: '·';
            margin-left: 0.5em;
        }

        .poetry-lines {
            font-size: 1.5rem;
            line-height: 2;
            white-space: pre-wrap;
            /* 保留换行 */
        }

        .poetry-lines p {
            margin-bottom: 0.5em;
        }

        .controls {
            margin-top: 4rem;
        }

        .btn-next {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .btn-next:hover {
            color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.03);
        }

        .btn-next svg {
            transition: transform 0.3s ease;
        }

        .btn-next:hover svg {
            transform: translateX(3px);
        }

        @media (max-width: 480px) {
            .poetry-title {
                font-size: 2rem;
            }

            .poetry-lines {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="site-header">
            <h1 class="logo">古韵</h1>
        </header>

        <main class="poetry-card" id="poetry-card">
            <div class="poetry-content">
                <h2 class="poetry-title" id="title"></h2>
                <div class="poetry-meta">
                    <span class="dynasty" id="dynasty"></span>
                    <span class="author" id="author"></span>
                </div>
                <div class="poetry-lines" id="content">
                    <!-- 诗句将通过 JS 插入 -->
                </div>
            </div>
        </main>

        <footer class="controls">
            <button id="next-btn" class="btn-next" aria-label="下一首">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12H20M20 12L14 6M20 12L14 18" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>赏析新篇</span>
            </button>
        </footer>
    </div>
    <script>
        const poems = [
            {
                title: "静夜思",
                dynasty: "唐",
                author: "李白",
                content: [
                    "床前明月光，",
                    "疑是地上霜。",
                    "举头望明月，",
                    "低头思故乡。"
                ]
            },
            {
                title: "春晓",
                dynasty: "唐",
                author: "孟浩然",
                content: [
                    "春眠不觉晓，",
                    "处处闻啼鸟。",
                    "夜来风雨声，",
                    "花落知多少。"
                ]
            },
            {
                title: "江雪",
                dynasty: "唐",
                author: "柳宗元",
                content: [
                    "千山鸟飞绝，",
                    "万径人踪灭。",
                    "孤舟蓑笠翁，",
                    "独钓寒江雪。"
                ]
            },
            {
                title: "登鹳雀楼",
                dynasty: "唐",
                author: "王之涣",
                content: [
                    "白日依山尽，",
                    "黄河入海流。",
                    "欲穷千里目，",
                    "更上一层楼。"
                ]
            },
            {
                title: "相思",
                dynasty: "唐",
                author: "王维",
                content: [
                    "红豆生南国，",
                    "春来发几枝。",
                    "愿君多采撷，",
                    "此物最相思。"
                ]
            },
            {
                title: "虞美人",
                dynasty: "五代",
                author: "李煜",
                content: [
                    "春花秋月何时了？往事知多少。",
                    "小楼昨夜又东风，故国不堪回首月明中。",
                    "雕栏玉砌应犹在，只是朱颜改。",
                    "问君能有几多愁？恰似一江春水向东流。"
                ]
            }
        ];

        const dom = {
            title: document.getElementById('title'),
            dynasty: document.getElementById('dynasty'),
            author: document.getElementById('author'),
            content: document.getElementById('content'),
            card: document.querySelector('.poetry-content'),
            nextBtn: document.getElementById('next-btn')
        };

        let currentIndex = 0;

        function renderPoem(index) {
            const poem = poems[index];

            // 渲染内容
            dom.title.textContent = poem.title;
            dom.dynasty.textContent = poem.dynasty;
            dom.author.textContent = poem.author;

            // 清空并重新生成诗句
            dom.content.innerHTML = '';
            poem.content.forEach(line => {
                const p = document.createElement('p');
                p.textContent = line;
                dom.content.appendChild(p);
            });
        }

        function switchPoem() {
            // 添加淡出类
            dom.card.classList.add('fade-out');

            setTimeout(() => {
                // 计算下一个索引（随机或顺序，这里用随机但避免重复）
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * poems.length);
                } while (nextIndex === currentIndex && poems.length > 1);

                currentIndex = nextIndex;
                renderPoem(currentIndex);

                // 移除淡出，添加淡入
                dom.card.classList.remove('fade-out');
                dom.card.classList.add('fade-in');

                // 清理淡入类，以便下次动画
                setTimeout(() => {
                    dom.card.classList.remove('fade-in');
                }, 600);

            }, 600); // 等待淡出动画完成
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderPoem(currentIndex);

            dom.nextBtn.addEventListener('click', switchPoem);
        });
    </script>
</body>

</html>
